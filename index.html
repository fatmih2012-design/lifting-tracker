*{box-sizing:border-box}

.wrap{max-width:640px;margin:0 auto}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
h1{font-size:1.9rem;line-height:1;margin:0;font-weight:700}
.total{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.total b{display:block;font-size:1.5rem;font-family:"Barlow Condensed",sans-serif;color:var(--ink)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.next{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:12px 14px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.next small{display:block;opacity:.85;font-size:12px}
.next b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:700}
.btn{border:0;border-radius:6px;padding:9px 14px;font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer;background:var(--on-accent);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 auto;min-width:78px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer}
.tab .cond{font-size:1.15rem;font-weight:700;display:block;line-height:1.1}
.tab small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.seg button{font:700 1.3rem "Barlow Condensed",sans-serif;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sess{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.sess button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer;font-variant-numeric:tabular-nums}
.sess button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.sess button.done{background:var(--soft);color:var(--accent)}
.sess button.done::after{content:" ✓"}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 0 4px}
.info{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.sec{font:700 .95rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 6px;color:var(--muted)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cc,var(--c-misc));border-radius:8px;padding:10px 12px;margin-bottom:8px}
.card.done{opacity:.6}
.card.done .nm{text-decoration:line-through}
.row{display:flex;gap:10px;align-items:flex-start}
.chk{flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:2px solid var(--cc,var(--c-misc));background:transparent;color:var(--on-accent);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-checked=true]{background:var(--cc,var(--c-misc))}
.chk[aria-checked=true]::after{content:"✓";font-weight:700}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cc,var(--c-misc));font-weight:600}
.nm{font-weight:600;font-size:16px;margin:1px 0}
.det{color:var(--muted);font-size:13.5px}
.log{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.log label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.log input{width:72px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:16px "IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums}
.last{font-size:12px;color:var(--muted)}
details{margin-top:6px}
summary{font-size:12.5px;color:var(--accent);cursor:pointer;padding:4px 0}
details p{font-size:13px;margin:4px 0;color:var(--muted)}
details input.nmin{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:16px "IBM Plex Sans",sans-serif;margin-top:4px}
ol.ramp{margin:6px 0;padding-left:20px;font-size:13.5px;color:var(--muted)}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:10}
.timer .t{font:700 1.7rem "Barlow Condensed",sans-serif;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.timer .t.end{color:var(--c-power)}
.timer button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 9px;font:600 13px "IBM Plex Sans",sans-serif;cursor:pointer}
.foot{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.foot small{color:var(--muted);width:100%}

function entry(p,w,s,id){return S.log[k(p,w,s,id)]||{}}
function sessDone(p,w,s){return items(p,w).every(function(it){return it.kind==='sec'||entry(p,w,s,it.id).d})}
function totals(){var n=0,pp=[];D.programs.forEach(function(_,p){var c=0;['A','B'].forEach(function(w){for(var s=1;s<=6;s++)if(sessDone(p,w,s))c++});pp.push(c);n+=c});return{n:n,pp:pp}}
function nextUp(){for(var p=0;p<4;p++)for(var s=1;s<=6;s++)for(var wi=0;wi<2;wi++){var w=wi?'B':'A';if(!sessDone(p,w,s))return{p:p,w:w,s:s}}return null}
/* persistence */
var ref=null,wt=null,writing=false,pending=false;
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(ref){clearTimeout(wt);wt=setTimeout(flush,900)}}
function flush(){if(writing){pending=true;return}writing=true;
 ref.set({state:JSON.stringify(S),u:S.u}).catch(function(){}).then(function(){writing=false;if(pending){pending=false;flush()}})}
(function(){try{if(!(window.claude&&window.claude.use))return;
 window.claude.use('db').then(function(db){if(!db)return;ref=db.doc('tracker/state');
  return ref.get().then(function(snap){
   if(snap.exists){var d=snap.data();if(d&&d.state){var r=JSON.parse(d.state);if(r&&r.u>S.u){S=r;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else if(r&&r.u<S.u){flush()}}}
   else if(S.u>0){flush()}})}).catch(function(){})}catch(e){}})();
/* render */
var root=document.getElementById('app');
function render(){
 var sel=S.sel,p=sel.p,w=sel.w,s=sel.s,T=totals(),nx=nextUp(),prog=D.programs[p];
 var h='<div class="top"><h1>Lifting Plan</h1><div class="total"><b>'+T.n+' / 48</b>workouts done</div></div><div class="bar"><i style="width:'+(T.n/48*100)+'%"></i></div>';
 if(nx){var isHere=nx.p===p&&nx.w===w&&nx.s===s;
  h+='<div class="next"><div><small>Next up</small><b>'+esc(D.programs[nx.p].name)+' · Workout '+nx.w+' · #'+nx.s+'</b></div>'+(isHere?'':'<button class="btn" data-go="'+nx.p+'.'+nx.w+'.'+nx.s+'">Go</button>')+'</div>'}
 else h+='<div class="next"><div><b>All 48 workouts done</b></div></div>';
 h+='<div class="lbl">Program</div><div class="tabs" role="tablist">';
 D.programs.forEach(function(pr,i){h+='<button class="tab" role="tab" aria-selected="'+(i===p)+'" data-p="'+i+'"><span class="cond">BT '+['I','II','III','IV'][i]+'</span><small>'+T.pp[i]+' / 12 done</small></button>'});
 h+='</div><div class="seg"><button aria-pressed="'+(w==='A')+'" data-w="A">Workout A</button><button aria-pressed="'+(w==='B')+'" data-w="B">Workout B</button></div>';
 h+='<div class="lbl">Session (each workout 6 times)</div><div class="sess">';
 for(var i=1;i<=6;i++)h+='<button aria-pressed="'+(i===s)+'" class="'+(sessDone(p,w,i)?'done':'')+'" data-s="'+i+'">'+i+'</button>';
 h+='</div><p class="info"><b>'+esc(prog.name)+'.</b> '+esc(prog.sub)+'</p>';
 items(p,w).forEach(function(it){
  if(it.kind==='sec'){h+='<div class="sec">'+esc(it.t)+'</div>';return}
  var e=entry(p,w,s,it.id),done=!!e.d;
  if(it.kind==='ramp'){h+='<div class="card done-'+done+(done?' done':'')+'"><div class="row"><button class="chk" role="checkbox" aria-checked="'+done+'" aria-label="RAMP done" data-c="r"></button><div><div class="tag">Warm-up</div><div class="nm">RAMP (about 10 min)</div><details><summary>Show the 10 moves</summary><ol class="ramp">'+D.ramp.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ol></details></div></div></div>';return}
  if(it.kind==='rec'){h+='<div class="card'+(done?' done':'')+'"><div class="row"><button class="chk" role="checkbox" aria-checked="'+done+'" aria-label="Recovery done" data-c="c"></button><div><div class="tag">Recovery</div><div class="nm">Foam roll and stretch</div><div class="det">'+esc(D.recovery)+'</div></div></div></div>';return}
  var r=it.r,c=cat(r.slot),nm=S.names[p+'.'+w+'.'+it.i]||r.ex;
  var last='';for(var q=s-1;q>=1;q--){var le=entry(p,w,q,it.id);if(le.kg||le.r){last='Last time: '+(le.kg?le.kg+' kg':'')+(le.kg&&le.r?' × ':'')+(le.r?le.r+' reps':'');break}}
  h+='<div class="card'+(done?' done':'')+'" style="--cc:var('+CATS[c][1]+')"><div class="row"><button class="chk" role="checkbox" aria-checked="'+done+'" aria-label="Done" data-c="'+it.id+'"></button><div style="flex:1;min-width:0"><div class="tag">'+esc(r.slot)+'</div><div class="nm">'+esc(nm)+'</div><div class="det">'+esc(r.reps)+(r.notes?' · '+esc(r.notes):'')+'</div>'
  +'<div class="log"><label>kg <input inputmode="decimal" data-f="kg" data-id="'+it.id+'" value="'+esc(e.kg||'')+'" aria-label="Weight in kg"></label><label>reps <input inputmode="numeric" data-f="r" data-id="'+it.id+'" value="'+esc(e.r||'')+'" aria-label="Reps"></label>'+(last?'<span class="last">'+esc(last)+'</span>':'')+'</div>'
  +'<details><summary>Swap exercise</summary><p>'+esc(menuFor(r.slot,c))+'</p><input class="nmin" data-nm="'+it.i+'" placeholder="Type your exercise name" value="'+esc(S.names[p+'.'+w+'.'+it.i]||'')+'" aria-label="Custom exercise name"></details></div></div></div>'});
 h+='<div class="foot"><button class="btn line" data-reset="1">Clear this session</button><button class="btn line" data-export="1">Export backup</button><label class="btn line" style="display:inline-block">Import backup<input type="file" id="imp" accept="application/json,.json" hidden></label><small>Progress is saved on this device automatically. Export a backup now and then.</small></div>';
 root.innerHTML=h}
root.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;var sel=S.sel;
 if(t.dataset.p!==undefined){S.sel={p:+t.dataset.p,w:sel.w,s:sel.s}}
 else if(t.dataset.w){S.sel={p:sel.p,w:t.dataset.w,s:sel.s}}
 else if(t.dataset.s){S.sel={p:sel.p,w:sel.w,s:+t.dataset.s}}
 else if(t.dataset.go){var g=t.dataset.go.split('.');S.sel={p:+g[0],w:g[1],s:+g[2]}}
 else if(t.dataset.c!==undefined){var key=k(sel.p,sel.w,sel.s,t.dataset.c);var e=S.log[key]||{};e.d=!e.d;S.log[key]=e;
  if(e.d)startTimerForCard(t)}
 else if(t.dataset.export){var bl=new Blob([JSON.stringify(S)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='lifting-backup.json';document.body.appendChild(a);a.click();a.remove();return}
 else if(t.dataset.reset){var pre=sel.p+'.'+sel.w+'.'+sel.s+'.';Object.keys(S.log).forEach(function(x){if(x.indexOf(pre)===0)delete S.log[x]})}
 else return;
 var y=window.scrollY;save();render();window.scrollTo(0,y)});
root.addEventListener('input',function(ev){var t=ev.target;var sel=S.sel;
 if(t.dataset.f){var key=k(sel.p,sel.w,sel.s,t.dataset.id);var e=S.log[key]||{};e[t.dataset.f]=t.value;S.log[key]=e;save()}
 else if(t.dataset.nm!==undefined){var nk=sel.p+'.'+sel.w+'.'+t.dataset.nm;if(t.value.trim())S.names[nk]=t.value;else delete S.names[nk];save()}});
root.addEventListener('change',function(ev){var t=ev.target;if(t.id!=='imp'||!t.files[0])return;var fr=new FileReader();fr.onload=function(){try{var r=JSON.parse(fr.result);if(r&&r.log){S=r;save();render()}}catch(e){}};fr.readAsText(t.files[0])});
/* rest timer */
var tm=null,left=0,tEl=document.getElementById('tt');
function fmt(n){return Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function startTimer(sec){clearInterval(tm);left=sec;tEl.className='t';tEl.textContent=fmt(left);
 tm=setInterval(function(){left--;if(left<=0){clearInterval(tm);tm=null;tEl.textContent='Go';tEl.className='t end';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}return}tEl.textContent=fmt(left)},1000)}
function startTimerForCard(){}
document.getElementById('timer').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
 if(b.dataset.sec)startTimer(+b.dataset.sec);else if(b.dataset.stop){clearInterval(tm);tm=null;tEl.textContent='0:00';tEl.className='t'}});
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
render();
</script></body></html>
